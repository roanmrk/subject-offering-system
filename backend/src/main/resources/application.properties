# ============================================================
# Server Configuration
# ============================================================
server.port=${PORT:8080}

# ============================================================
# MySQL Database Configuration
# ============================================================
# In PRODUCTION (Render): uses SPRING_DATASOURCE_* env vars
# In LOCAL DEV: falls back to localhost MySQL with password below
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/earist_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Roanmark07}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# Logging
# ============================================================
logging.level.com.earist.ccs.scheduler=INFO
logging.level.org.hibernate.SQL=WARN

# ============================================================
# Static Resources (serve React build from classpath)
# ============================================================
spring.web.resources.static-locations=classpath:/static/