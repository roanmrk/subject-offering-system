# ============================================================
# Server Configuration
# ============================================================
server.port=${PORT:8080}

# ============================================================
# MySQL Database Configuration
# ============================================================
# In PRODUCTION (Render): uses SPRING_DATASOURCE_* env vars
# In LOCAL DEV: falls back to localhost MySQL with password below
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/earist_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Roanmark07}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA Configuration
# ============================================================
# IMPORTANT: ddl-auto=validate prevents Hibernate from silently
# altering your production Aiven schema. Schema is managed via
# database/reset_database.sql only.
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# JWT Configuration
# ============================================================
# REQUIRED in production: set JWT_SECRET env var to a Base64
# string of at least 32 random bytes. Example generation:
#   openssl rand -base64 48
# If unset, a random key is generated at startup which means
# tokens invalidate on every restart (dev-only fallback).
# ============================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# Logging
# ============================================================
logging.level.com.earist.ccs.scheduler=INFO
logging.level.org.hibernate.SQL=WARN

# ============================================================
# Static Resources (serve React build from classpath)
# ============================================================
spring.web.resources.static-locations=classpath:/static/